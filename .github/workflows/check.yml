# CI check for every PR: format + lint + typecheck + unit tests + build.
# (Deployment is Cloudflare Workers Builds — see DEPLOYMENT.md.)
name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check (prettier, oxlint, tsc)
        run: pnpm check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  # The news bot's PR may change data/news/ and nothing else. Auto-merge relies
  # on this: a person pushing code to bot/news-data cannot get it merged.
  data-only-guard:
    if: github.head_ref == 'bot/news-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only data/news/ may change
        run: |
          outside=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -v '^data/news/' || true)
          if [ -n "$outside" ]; then
            echo "::error::bot/news-data may only change data/news/. Also changed:"
            echo "$outside"
            exit 1
          fi

  # The bids and jobs bot's PR may change data/bids/ and data/jobs/ only. It
  # never merges itself, but a reviewer should only ever see data in it.
  notices-data-guard:
    if: github.head_ref == 'bot/notices-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only data/bids/ and data/jobs/ may change
        run: |
          outside=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" | grep -Ev '^data/(bids|jobs)/' || true)
          if [ -n "$outside" ]; then
            echo "::error::bot/notices-data may only change data/bids/ and data/jobs/. Also changed:"
            echo "$outside"
            exit 1
          fi
