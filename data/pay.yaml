      31: 300961
# Each office's salary grade. `cap: true` means the law sets a ceiling (an
# honorarium "not to exceed" that grade), not a fixed salary. `schedule` says
# which circular's table applies: national for the House, local for the city.
offices:
  representative:
    grade: 31
    schedule: national
    basis: Republic Act No. 6758, Sec. 8
    url: https://lawphil.net/statutes/repacts/ra1989/ra_6758_1989.html
  mayor:
    grade: 30
    schedule: local
    basis: Republic Act No. 7675 (city charter), Sec. 8
    url: https://lawphil.net/statutes/repacts/ra1994/ra_7675_1994.html
  vice-mayor:
    grade: 28
    schedule: local
    basis: Republic Act No. 7675 (city charter), Sec. 9
    url: https://lawphil.net/statutes/repacts/ra1994/ra_7675_1994.html
  # DBM's index lists "Sangguniang Panlungsod Member I" (SG 25) and "Member II"
  # (SG 27) without saying which cities get which. SG 27 pairs with the
  # charter's SG 28 vice mayor ("City Vice Mayor II" in the same index), but
  # no document we found says so for Mandaluyong. Confirm, then drop `note`.
  councilor:
    grade: 27
    schedule: local
    basis:
      DBM Index of Occupational Services, Position Titles and Salary Grades in
      the Local Government (2021)
    url: https://www.dbm.gov.ph/wp-content/uploads/OPCCB/LBC/PART1-IOS-LGU-2021.pdf
    note: unconfirmed
  captain:
    grade: 14
    cap: true
    schedule: local
    basis: Local Budget Circular No. 172, Sec. 8
    url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2026/Local-Budget-Circular/LOCAL-BUDGET-CIRCULAR-NO-172-DATED-JULY-16-2026.pdf
  kagawad:
    grade: 10
    cap: true
    schedule: local
    basis: Local Budget Circular No. 172, Sec. 8
    url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2026/Local-Budget-Circular/LOCAL-BUDGET-CIRCULAR-NO-172-DATED-JULY-16-2026.pdf
  # The SK chair sits on the barangay council with a kagawad's privileges.
  sk-chair:
    grade: 10
    cap: true
    schedule: local
    basis: Republic Act No. 10742, Sec. 12
    url: https://lawphil.net/statutes/repacts/ra2016/ra_10742_2016.html
  sk-kagawad:
    grade: 9
    cap: true
    schedule: local
    # The SG 9 ceiling is in Local Budget Circular No. 148 (2022), Sec. 3.1.5,
    # which implements this law; we couldn't find a stable link to its PDF.
    basis: Republic Act No. 11768; Local Budget Circular No. 148, Sec. 3.1.5
    url: https://lawphil.net/statutes/repacts/ra2022/ra_11768_2022.html
