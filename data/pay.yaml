# What the law sets as pay for the offices Mandaluyong's officials hold.
# Hand-kept, from DBM's budget circulars and the laws they cite: every amount
# was read from the circular's own salary schedule (Step 1, the 100% schedule
# for special and 1st-class cities). These are national rates, not the city's
# payroll: the city adopts each year's rates by ordinance, and its payroll
# isn't published. Allowances (PERA, RATA) and bonuses are not included.
# See data/CONTEXT.md. Amounts are whole pesos a month.
checked: 2026-11-26
law:
  title: Executive Order No. 64, s. 2024
  url: https://lawphil.net/executive/execord/eo2024/eo_64_2024.html
tranches:
  - year: 2024
    national:
      title: National Budget Circular No. 594
      url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2024/National-Budget-Circular/NATIONAL-BUDGET-CIRCULAR-NO-594.pdf
    local:
      title: Local Budget Circular No. 160
      url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2024/Local-Budget-Circular/LOCAL-BUDGET-CIRCULAR-NO-160.pdf
    step1:
      9: 22219
      10: 24381
      14: 35434
      27: 136893
      28: 154320
      30: 196199
      31: 285813
  - year: 2025
    national:
      title: National Budget Circular No. 597
      url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2025/National-Budget-Circular/NBC-No.-597.pdf
    local:
      title: Local Budget Circular No. 165
      url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2025/Local-Budget-Circular/LOCAL-BUDGET-CIRCULAR-NO-165.pdf
    step1:
      9: 23226
      10: 25586
      14: 37024
      27: 142663
      28: 160469
      30: 203200
      31: 293191
  - year: 2026
    national:
      title: National Budget Circular No. 601
      url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2026/National-Budget-Circular/NATIONAL-BUDGET-CIRCULAR-NO.-601_NEW.pdf
    local:
      title: Local Budget Circular No. 172
      url: https://www.dbm.gov.ph/wp-content/uploads/Issuances/2026/Local-Budget-Circular/LOCAL-BUDGET-CIRCULAR-NO-172-DATED-JULY-16-2026.pdf
    step1:
      9: 24329
      10: 26917
      14: 38764
