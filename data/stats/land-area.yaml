# Land area of each barangay, in hectares, from the City Government's "Table
# 4.01. Land Area Distribution by Barangay" on its Physical and Spatial
# Characteristics page. Hand-kept; see data/CONTEXT.md. The table has no date;
# `read` is when we copied it.
#
# The city states a total of 1,126 hectares (11.26 sq. km). Its 27 rows add up
# to 1,125.86 ha; schema.ts allows the rows to be within 0.5 ha of `total`.
# A footnote says the earlier 1,124.97 ha differs "due to AUTOCADD application
# in computing land area by barangay". The city's older Land Area page
# (mandaluyong.gov.ph/profile/land-area/) still gives 1,124.97 ha and older
# figures (Wack-Wack 294.48, Addition Hills 162, Plainview 115.92, Highway
# Hills 105.12). We use Table 4.01, which the city's Facts and Figures page
# also quotes. PSA lists a different city area (9.29 sq. km); not used here.
source:
  title: "City of Mandaluyong: Table 4.01, Land Area Distribution by Barangay"
  url: https://mandaluyong.gov.ph/physical-and-spatial-characteristics/
read: 2026-11-26
total: 1126
# Barangay slug: hectares. Comments give the PSGC code and the table's name.
barangays:
