# People living in each barangay, from the Philippine Statistics Authority's
# censuses. Hand-kept; see data/CONTEXT.md. Each census lists its official
# total, and the barangays must add up to it (schema.ts checks).
#
# 2020: PSA's barangay counts as republished by OCHA on HDX (CC BY), read
# from the xlsx and matched by PSGC code.
# 2024: PSA's site blocks automated downloads, so these come from City
# Population (citypopulation.de), which compiles PSA's census tables. Its
# 2020 column matches the OCHA file for all 27 barangays, and its city total
# matches the DTI competitiveness index profile. `checked: false` until
# someone compares them with PSA's own 2024 file.
censuses:
  - year: 2020
    date: 2020-05-01
    total: 425758
    proclamation:
      title: Proclamation No. 1179, s. 2021
      url: https://lawphil.net/executive/proc/proc2021/proc_1179_2021.html
    source:
      title:
        "OCHA HDX: Philippines Total Population by Barangay (2020 census, from
        PSA)"
      url: https://data.humdata.org/dataset/2020-census-total-population-by-barangay_admin4
    checked: true
  - year: 2024
    date: 2024-07-01
    total: 465902
    proclamation:
      title: Proclamation No. 973, s. 2025
      url: https://lawphil.net/executive/proc/proc2025/proc_973_2025.html
    source:
      title: "City Population: Mandaluyong (2024 census, from PSA)"
      url: https://www.citypopulation.de/en/philippines/mandaluyong/
    checked: false
# Barangay slug: people counted, by census year. Comments give the PSGC code.
