# Poverty incidence among the population: the share of people whose family
# income is below the poverty threshold. From the Philippine Statistics
# Authority's "2023 Full Year Official Poverty Statistics of the Philippines"
# (released 2024-08-15): Table 2a (incidence, by highly urbanized city) and
# Table 6a (number of poor people), read from the PDF downloaded by hand from
# psa.gov.ph on 2026-11-26. Hand-kept; see data/CONTEXT.md.
#
# PSA flags all three of Mandaluyong's estimates (a/, b/, c/): their
# coefficients of variation are above 10%, so use them with caution. It marks
# none of the city's changes as significant; it marks NCR's 2018-2021 and
# 2021-2023 changes, and the country's all three.
years: [2018, 2021, 2023]
release:
  title: 2023 Full Year Official Poverty Statistics of the Philippines (PSA)
  url: https://psa.gov.ph/sites/default/files/phdsd/2023%20FY%20Official%20Poverty%20Statistics%20Publication_15August2024.pdf
released: 2024-08-15
# low/high below are PSA's 95% confidence interval.
confidence: 95
# Pesos a person needs a year for basic food and non-food needs, in NCR.
threshold: { 2018: 28682, 2021: 32978, 2023: 37711 }
# incidence, cv, low, high are percents as PSA prints them (one decimal);
# poor is PSA's estimate in thousands, times 1,000.
areas:
  city:
    2018: { incidence: 1.3, cv: 39.4, low: 0.3, high: 2.4, poor: 5620 }
    2021: { incidence: 0.7, cv: 51.7, low: 0.0, high: 1.4, poor: 3130 }
    2023: { incidence: 0.5, cv: 53.4, low: 0.0, high: 1.0, poor: 2420 }
    significant: []
  ncr:
    2018: { incidence: 2.2, cv: 11.4, low: 1.7, high: 2.7, poor: 302170 }
    2021: { incidence: 3.5, cv: 6.8, low: 3.0, high: 3.9, poor: 482480 }
    2023: { incidence: 1.8, cv: 9.9, low: 1.5, high: 2.2, poor: 262240 }
    significant: [2018-2021, 2021-2023]
  philippines:
    2018: { incidence: 16.7, cv: 1.3, low: 16.3, high: 17.1, poor: 17670210 }
    2021: { incidence: 18.1, cv: 1.3, low: 17.6, high: 18.5, poor: 19902750 }
    2023: { incidence: 15.5, cv: 1.4, low: 15.1, high: 16.0, poor: 17538860 }
    significant: [2018-2021, 2021-2023, 2018-2023]
