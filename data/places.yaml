# Government places shown on the barangay maps: barangay halls, city
# offices, national government offices, police, and fire stations. The map
# reads every pin from this file.
#
# Each place has exactly one source:
# - `osm`: the OpenStreetMap element it came from (n = node, w = way,
#   r = relation), checkable on openstreetmap.org. © OpenStreetMap
#   contributors, ODbL 1.0, fetched 2026-11-26; those entries are offered
#   under the ODbL (see NOTICE.md).
# - `google`: a Google Maps listing's CID (quoted digits; open it at
#   https://maps.google.com/?cid=<digits>). Used only for the three barangay
#   halls OpenStreetMap doesn't have: Buayang Bato, Mabini-J. Rizal, and
#   Pag-asa, looked up 2026-11-26. These are not OpenStreetMap data and not
#   covered by the ODbL; Google's terms limit storing its data, which the
#   maintainers accepted. Replace each with an `osm` entry once the hall is on
#   OpenStreetMap.
#
# Names are tidied (spelling, capitalization); a hall takes its name from its
# barangay. Places with no name are left out. Notes on hall choices:
# - Malamig and Harapin ang Bukas: OSM tags each hall as a multi-purpose hall;
#   both match the city's address (Malamig: Cresta Street; Harapin ang Bukas:
#   Sen. Neptali A. Gonzales Street, the former Daang Bakal Street), and
#   Google Maps lists Harapin ang Bukas's as the barangay hall.
# - Mabini-J. Rizal: Google lists several buildings nearby; this is "MJR
#   Barangay Hall and Multi-Purpose Center" (70 A. Mabini). Confirm locally.
# - Pag-asa: Google gives 60 Gen. Kalentong; the city says 658 Gen. Kalentong.
# - Addition Hills: OSM has three halls; this one is tagged as run by the
#   barangay.
#
# kind: barangay-hall (needs `barangay`, a file name in data/barangays/),
# city, national, police, fire, or rail (MRT and LRT stations inside the city;
# no LRT line runs through Mandaluyong). Edit by hand; data/schema.ts checks it.

